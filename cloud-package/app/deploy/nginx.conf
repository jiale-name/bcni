# ============================================================================
# AI 数字化人才平台 · 生产/准生产 Nginx（CU-24，架构 §7.2 / §7.3）
#
# 职责（架构 §7.2「应用区」）：**托管前端 dist + 反代 /api 到后端 8002**。
# 用**一个 origin** 提供前后端，是这里最关键的一个决定：
#
#   * 前后端同源 ⇒ **不需要 CORS**。生产环境放开 CORS 等于给所有站点开了
#     带 Cookie 的读写权限；开发期之所以要 CORS 只因为前端跑在 :5173。
#   * ``X-Request-Id`` 不会在跨域重定向中丢失（它是本项目 trace 的串联手段）。
#
# 使用：容器方式（推荐）
#   docker run -d --name talent-web -p 80:80 \
#     -v D:/gan/16个人项目/frontend/dist:/usr/share/nginx/html:ro \
#     -v D:/gan/16个人项目/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
#     --add-host host.docker.internal:host-gateway \
#     nginx:1.27-alpine
# （后端跑在宿主 8002，故反代目标用 ``host.docker.internal``；若后端也容器化，
#   改成 ``http://backend:8002`` 并挂到同一个自定义网络。）
# ============================================================================

# 后端上游。``host.docker.internal`` 由 Docker Desktop 在 Windows/macOS 上提供；
# Linux 需在 docker run 时加 ``--add-host host.docker.internal:host-gateway``。
upstream talent_backend {
    server host.docker.internal:8002;
    keepalive 32;              # 复用后端长连接，避免每次请求重新三次握手
}

# 后端返回 5xx / 502 / 504 时不要直接把裸错误页抛给浏览器 —— 前端是 SPA，
# 它需要看到统一响应结构才有机会渲染「服务异常」而不是一片空白。
# （做法：把上游超时交给后端自己的统一异常处理，见下方 proxy_next_upstream 与
#   后端 exceptions/exception_handlers.py 的第 8 层兜底；此处不再额外改写响应体。）

server {
    listen       80;
    server_name  _;

    # ------------------------------------------------------------------
    # 🔴 上传体积上限必须与后端 UPLOAD_MAX_FILE_SIZE_MB 对齐
    #    （backend/app/config.py 默认 50MB）。
    #    只调后端不调这里 = 大文件在 Nginx 层被 413 拦下，
    #    而后端的「文件过大」业务校验**永远不会被触发** ——
    #    使用者看到的是 Nginx 的英文 413 页，且后端日志里一条记录都没有。
    # ------------------------------------------------------------------
    client_max_body_size 50m;
    client_body_timeout  120s;

    # 安全响应头（不引入额外模块，nginx 自带）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------
    # 前端静态资源（SPA）
    # ------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的构建产物（Vite 输出 assets/xxx.[hash].js）可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 🔴 SPA 回退：**必须放在最后**且用 try_files 兜到 index.html。
    #    前端路由（如 /talent/123）在服务端没有对应文件，不加这条会 404；
    #    而加了之后要注意「不要吃掉 /api」——由下面更精确的 location 保证
    #    （Nginx 前缀匹配取最长，``/api/`` 比 ``/`` 更长，故优先）。
    location / {
        try_files $uri $uri/ /index.html;
        # index.html **不缓存**：否则发版后用户仍加载旧 HTML，
        # 引用的旧 hash 资源已被清掉 → 白屏（最典型的「发版后部分用户打不开」）。
        add_header Cache-Control "no-store";
    }

    # ------------------------------------------------------------------
    # 后端 API 反向代理
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://talent_backend;
        proxy_http_version 1.1;

        # 传真实客户端信息（审计的 ip / ua 留痕依赖它，见 RequestMetaMiddleware）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传链路 ID（接口 §1.1 的 X-Request-Id）：不传的话跨端串联在 Nginx 处断掉
        proxy_set_header X-Request-Id      $http_x_request_id;
        proxy_set_header Connection        "";

        # 大文件上传 / 简历解析等长任务的超时（≥ 后端模型超时，避免 Nginx 先放弃）
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 上游异常时由前端按统一结构处理（后端正常情况下不会返回裸 5xx）
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ------------------------------------------------------------------
    # 运维探针（不写 access_log，避免每分钟一条噪声）
    # ------------------------------------------------------------------
    location = /health {
        proxy_pass http://talent_backend/health;
        access_log off;
    }

    # Nginx 自身的存活探针
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # 隐藏文件（.env / .git）一律拒答 —— 静态目录若被误挂成站点根，这是最后一道门
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ============================================================================
# SSE / 流式接口（架构 §7.2 的 N2 / N5 用到，**本期先备好**）
# ----------------------------------------------------------------------------
# 🔴 为什么单列一个 server 块：流式响应必须关掉 ``proxy_buffering``，
#    否则 Nginx 会「攒够一个 buffer 再发」，前端表现为「一直在转圈、
#    然后一次性吐出全部内容」—— 看起来像后端没做流式，实际是 Nginx 攒着。
#    单独一块便于按端口灰度，不影响上面对普通接口的缓冲策略（缓冲能显著降后端压力）。
