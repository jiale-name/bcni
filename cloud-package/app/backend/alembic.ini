# ============================================================================
# Alembic configuration (CU-02 / CU-01 batch)
#
# NOTE: This file is intentionally PURE ASCII.
#   Alembic reads the ini with `encoding="locale"`. On Chinese Windows the
#   locale codec is GBK, so any non-ASCII character here raises
#   UnicodeDecodeError before Alembic even starts.
#   -> Keep this file ASCII. Write Chinese notes in alembic/README.md instead.
#
# sqlalchemy.url is intentionally LEFT EMPTY: the connection string has exactly
# one source -- app/config.py (settings.database_url), injected by alembic/env.py.
# This prevents "migrations hit DB A while the app hits DB B".
#
# Common commands (run from backend/):
#   .venv/Scripts/python.exe -m alembic revision --autogenerate -m "desc"
#   .venv/Scripts/python.exe -m alembic upgrade head
#   .venv/Scripts/python.exe -m alembic downgrade -1
#   .venv/Scripts/python.exe -m alembic upgrade head --sql   # offline DDL (no DB needed)
# ============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Migration filename template: timestamp prefix keeps bulk-generated revisions
# in chronological order even within the same minute.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
